<svg viewBox="0 0 496 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="個別面談のイメージ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcf3fd" />
      <stop offset="1" stop-color="#7fd6f6" />
    </linearGradient>
  </defs>

  <rect width="496" height="496" fill="url(#bg)" />

  <!-- 背景の装飾アイコン -->
  <g opacity="0.55">
    <!-- 卒業帽（進路のイメージ） -->
    <g transform="translate(78,96) rotate(-12)">
      <path d="M0 14 L34 0 L68 14 L34 28 Z" fill="#ffffff" />
      <path d="M20 20 L20 36 C20 44 48 44 48 36 L48 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <circle cx="64" cy="16" r="3.5" fill="#ffffff" />
      <line x1="64" y1="16" x2="64" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>
    <!-- キラキラ -->
    <g fill="#ffd84d">
      <path d="M404 84 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" />
    </g>
    <g fill="#ffffff">
      <circle cx="366" cy="66" r="5" />
      <circle cx="120" cy="410" r="6" />
    </g>
  </g>

  <!-- 吹き出し（相談のイメージ） -->
  <g transform="translate(300,88)">
    <rect x="0" y="0" width="118" height="66" rx="22" fill="#ffffff" />
    <path d="M18 60 L10 82 L38 60 Z" fill="#ffffff" />
    <path d="M27 33 c0 -10 8 -16 17 -16 c9 0 17 6 17 16 c0 8 -6 13 -13 15 c-1 4 -1 6 -4 9 c1 -5 -1 -7 -3 -8 c-9 -2 -14 -8 -14 -16 Z" fill="#fb6f9d" />
  </g>

  <!-- テーブル -->
  <ellipse cx="248" cy="372" rx="154" ry="34" fill="#fff9fb" stroke="#7fd6f6" stroke-width="6" />

  <!-- クリップボード（テーブルの上） -->
  <g transform="translate(213,344)">
    <rect x="0" y="6" width="70" height="52" rx="10" fill="#ffffff" stroke="#dcf3fd" stroke-width="3" />
    <rect x="22" y="0" width="26" height="12" rx="5" fill="#00a2e7" />
    <line x1="12" y1="26" x2="46" y2="26" stroke="#8b7a90" stroke-width="4" stroke-linecap="round" />
    <line x1="12" y1="36" x2="40" y2="36" stroke="#8b7a90" stroke-width="4" stroke-linecap="round" />
    <path d="M12 46 L20 54 L36 40" fill="none" stroke="#34c9a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 講師（向かって左） -->
  <g transform="translate(96,168)">
    <!-- 体 -->
    <path d="M10 230 C10 150 30 108 92 108 C154 108 174 150 174 230 Z" fill="#00a2e7" />
    <!-- 首 -->
    <rect x="72" y="86" width="40" height="30" rx="14" fill="#ffddbb" />
    <!-- 顔 -->
    <circle cx="92" cy="62" r="54" fill="#ffddbb" />
    <!-- 髪 -->
    <path d="M38 58 C34 14 150 14 146 58 C146 30 118 12 92 12 C66 12 38 30 38 58 Z" fill="#43304a" />
    <path d="M36 54 C30 78 34 96 44 108 C40 90 40 70 46 56 Z" fill="#43304a" />
    <path d="M148 54 C154 78 150 96 140 108 C144 90 144 70 138 56 Z" fill="#43304a" />
    <!-- 頬 -->
    <circle cx="66" cy="72" r="9" fill="#ffcede" opacity="0.7" />
    <circle cx="118" cy="72" r="9" fill="#ffcede" opacity="0.7" />
    <!-- 表情 -->
    <circle cx="74" cy="60" r="5" fill="#43304a" />
    <circle cx="110" cy="60" r="5" fill="#43304a" />
    <path d="M78 80 C86 88 98 88 106 80" fill="none" stroke="#43304a" stroke-width="4.5" stroke-linecap="round" />
    <!-- 案内する手 -->
    <path d="M158 190 C182 196 196 208 198 226 C186 226 176 220 166 208" fill="#ffddbb" />
  </g>

  <!-- 生徒（向かって右） -->
  <g transform="translate(230,180)">
    <!-- 体（制服） -->
    <path d="M4 220 C4 146 24 106 82 106 C140 106 160 146 160 220 Z" fill="#fb6f9d" />
    <!-- リボン -->
    <path d="M82 118 L68 132 L82 128 L96 132 Z" fill="#ffd84d" />
    <!-- 首 -->
    <rect x="64" y="84" width="36" height="28" rx="13" fill="#ffddbb" />
    <!-- 顔 -->
    <circle cx="82" cy="60" r="50" fill="#ffddbb" />
    <!-- 髪（長め） -->
    <path d="M32 62 C28 6 136 6 132 62 C132 92 126 118 118 132 C122 104 120 82 110 68 C104 78 60 78 54 68 C44 82 42 104 46 132 C38 118 32 92 32 62 Z" fill="#5c4a63" />
    <!-- 頬 -->
    <circle cx="58" cy="68" r="8" fill="#ffcede" opacity="0.7" />
    <circle cx="106" cy="68" r="8" fill="#ffcede" opacity="0.7" />
    <!-- 表情（話を聞いてにっこり） -->
    <circle cx="65" cy="58" r="4.5" fill="#43304a" />
    <circle cx="99" cy="58" r="4.5" fill="#43304a" />
    <path d="M68 76 C75 83 89 83 96 76" fill="none" stroke="#43304a" stroke-width="4" stroke-linecap="round" />
    <!-- 話を聞く手（頬に添える） -->
    <path d="M18 176 C0 186 -8 200 -2 216 C10 212 20 202 26 188" fill="#ffddbb" />
  </g>
</svg>
